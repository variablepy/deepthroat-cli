name: Release DeepThroat CLI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        default: v0.1.8
        type: string
      verifyonly:
        description: Verify an existing release without rebuilding or publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.repository == 'variablepy/deepthroat-cli' && !inputs.verifyonly
    runs-on: windows-latest
    env:
      releaseversion: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: ./.github/actions/setup-bun
      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:releaseversion -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$' -or $env:releaseversion -ne "v$version") { throw 'Tag and package version must match' }
      - name: Verify types and regressions
        run: bun run verify
      - name: Build standalone Windows CLI
        run: bun run --cwd packages/cli script/build.ts --single --baseline --skip-install --skip-web-ui
      - name: Package executable and checksums
        run: bun run packages/cli/script/package-release.ts --baseline
      - name: Smoke test compiled CLI
        shell: pwsh
        run: |
          $version = & ./artifacts/deepthroat-windows-x64.exe --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "deepthroat $env:releaseversion") { throw 'Compiled CLI version mismatch' }
          & ./artifacts/deepthroat-windows-x64.exe auth --help
          if ($LASTEXITCODE -ne 0) { throw 'Compiled authentication help failed' }
          $providers = & ./artifacts/deepthroat-windows-x64.exe api --standalone get /api/websearch/provider | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($providers.data | Where-Object { $_.id -eq 'deepthroat' }).Count -ne 1) { throw 'Hosted web search was not registered in the executable' }
      - name: Verify isolated Windows installation integration
        shell: pwsh
        run: ./script/testwindows.ps1 -binary ./artifacts/deepthroat-windows-x64.exe
      - name: Stage verified Windows assets
        shell: pwsh
        run: Move-Item artifacts/SHA256SUMS artifacts/SHA256SUMS.windows
      - uses: actions/upload-artifact@v4
        with:
          name: cli-windows
          path: artifacts/*
          retention-days: 3
  linux:
    if: github.repository == 'variablepy/deepthroat-cli' && !inputs.verifyonly
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x64
            baseline: --baseline
          - runner: ubuntu-24.04-arm
            architecture: arm64
            baseline: ""
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      releaseversion: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: ./.github/actions/setup-bun
      - name: Verify version and installer
        run: |
          test "v$(node -p "require('./package.json').version")" = "$releaseversion"
          bash -n install
          python3 script/testlinux.py
      - name: Build native Linux CLI
        run: bun run --cwd packages/cli script/build.ts --single ${{ matrix.baseline }} --skip-install --skip-web-ui
      - name: Package native executable and checksums
        run: bun run packages/cli/script/package-linux.ts
      - name: Smoke test compiled CLI and install
        run: |
          binary="$PWD/artifacts/deepthroat-linux-${{ matrix.architecture }}"
          test "$("$binary" --version)" = "deepthroat $releaseversion"
          "$binary" auth --help
          "$binary" api --standalone get /api/websearch/provider > "$RUNNER_TEMP/search.json"
          node -e 'const fs=require("fs");const data=JSON.parse(fs.readFileSync(process.argv[1]));if(!data.data.some(x=>x.id==="deepthroat"))process.exit(1)' "$RUNNER_TEMP/search.json"
          bash install --binary "$binary" --directory "$RUNNER_TEMP/cli install/bin"
          bash install --binary "$binary" --directory "$RUNNER_TEMP/cli install/bin"
          test "$("$RUNNER_TEMP/cli install/bin/deepthroat" --version)" = "deepthroat $releaseversion"
          "$RUNNER_TEMP/cli install/bin/deepthroat" --help
      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux-${{ matrix.architecture }}
          path: artifacts/*
          retention-days: 3
  publish:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    env:
      releaseversion: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: artifacts
          merge-multiple: true
      - name: Publish all verified platforms together
        run: |
          cat artifacts/SHA256SUMS.windows artifacts/SHA256SUMS.linux-x64 artifacts/SHA256SUMS.linux-arm64 > artifacts/SHA256SUMS
          (cd artifacts && sha256sum --check SHA256SUMS)
          cp install artifacts/install.sh
          cp install.ps1 artifacts/install.ps1
          cd artifacts
          sha256sum install.sh install.ps1 >> SHA256SUMS
          rm SHA256SUMS.windows SHA256SUMS.linux-x64 SHA256SUMS.linux-arm64
          gh release create "$releaseversion" ./* --verify-tag --draft --title "DeepThroat CLI $releaseversion" --notes-file ../docs/release-notes.md
          gh release edit "$releaseversion" --draft=false --latest
  linuxinstallation:
    if: always() && (needs.publish.result == 'success' || inputs.verifyonly)
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      releaseversion: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Install and reinstall public Linux release
        run: |
          curl -fsSL "https://github.com/variablepy/deepthroat-cli/releases/download/$releaseversion/install.sh" -o "$RUNNER_TEMP/install.sh"
          bash "$RUNNER_TEMP/install.sh" --version "$releaseversion" --directory "$RUNNER_TEMP/public cli/bin"
          bash "$RUNNER_TEMP/install.sh" --version "$releaseversion" --directory "$RUNNER_TEMP/public cli/bin"
          export PATH="$RUNNER_TEMP/public cli/bin:$PATH"
          test "$(deepthroat --version)" = "deepthroat $releaseversion"
          deepthroat auth --help
          deepthroat upgrade "$releaseversion" --method standalone
          test "$(deepthroat --version)" = "deepthroat $releaseversion"
  installation:
    if: always() && (needs.publish.result == 'success' || inputs.verifyonly)
    needs: publish
    runs-on: windows-latest
    env:
      releaseversion: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Install the public standalone release
        shell: pwsh
        run: |
          $directory = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'deepthroat cli/bin'))
          $legacydir = Join-Path $env:LOCALAPPDATA 'Programs/deepthroat'
          $null = New-Item -ItemType Directory -Path $legacydir -Force
          $legacy = Join-Path $legacydir 'deepthroat.cmd'
          [IO.File]::WriteAllText($legacy, ('@echo off' + "`r`n" + 'python "C:\legacy\deepthroat\cli\entry.py" %*' + "`r`n"), [Text.Encoding]::ASCII)
          $env:Path = "$legacydir;$env:Path"
          $registry = 'HKCU:\Software\DeepThroat\CLI'
          ./install.ps1 -version $env:releaseversion -directory $directory
          $null = New-ItemProperty -LiteralPath $registry -Name sentinel -Value preserve -PropertyType String
          ./install.ps1 -version $env:releaseversion -directory $directory
          $registration = Get-ItemProperty -LiteralPath $registry
          if ($registration.standalone -ne $directory -or $registration.sentinel -ne 'preserve') { throw 'Installer replaced shared registration values' }
          $resolved = (@(Get-Command deepthroat -CommandType Application)[0]).Source
          if ($resolved -ne (Join-Path $directory 'deepthroat.exe')) { throw 'CLI command resolves to the wrong application' }
          $reported = & deepthroat --version
          if ($LASTEXITCODE -ne 0 -or $reported -ne "deepthroat $env:releaseversion") { throw 'Installed CLI version mismatch' }
          & deepthroat --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI could not start' }

          $reported = & $legacy --version
          if ($LASTEXITCODE -ne 0 -or $reported -ne "deepthroat $env:releaseversion") { throw 'Legacy Python launcher was not repaired' }
          if (-not (Test-Path -LiteralPath ($legacy + '.legacy-backup'))) { throw 'Legacy launcher backup is missing' }
          $env:Path = "$legacydir;$env:Path"
          $reported = & powershell.exe -NoProfile -Command 'deepthroat --version'
          if ($LASTEXITCODE -ne 0 -or $reported -ne "deepthroat $env:releaseversion") { throw 'Existing terminal PATH still invokes the broken launcher' }
          $binary = Join-Path $directory 'deepthroat.exe'
          & $binary upgrade v0.1.0 --method standalone
          if ($LASTEXITCODE -ne 0) { throw 'Live executable downgrade failed' }
          $reported = & $binary --version
          if ($reported -ne 'deepthroat v0.1.0') { throw 'Downgraded executable did not launch' }
          & $binary upgrade $env:releaseversion --method standalone
          if ($LASTEXITCODE -ne 0) { throw 'Live executable upgrade failed' }
          $reported = & $binary --version
          if ($LASTEXITCODE -ne 0 -or $reported -ne "deepthroat $env:releaseversion") { throw 'Upgraded executable did not launch' }
