name: Check DeepThroat CLI

on:
  push:
    branches: [deepthroat]
  pull_request:
    branches: [deepthroat]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/setup-bun
      - name: Typecheck every workspace
        run: bun run typecheck:tsc
      - name: Verify generated client contracts
        working-directory: packages/client
        run: bun run check:generated
      - name: Verify CLI configuration schema
        working-directory: packages/cli
        run: bun run script/schema.ts schema.json --check
