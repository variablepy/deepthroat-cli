name: Pull request title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: Require a conventional title
        env:
          title: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$title" | grep -Eq '^(feat|fix|docs|chore|refactor|test)(\([a-z0-9-]+\))?: .+'
